<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060606" />
    <title>miniapps offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Montserrat", "Inter", system-ui, sans-serif;
        color: #111111;
        background: #efefef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(0, 0, 0, 0.06), transparent 35%),
          linear-gradient(180deg, #f3f3f3 0%, #e9e9e9 100%);
      }

      main {
        width: min(100%, 520px);
        padding: 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1;
      }

      p {
        margin: 0;
        color: #4d4d4d;
        line-height: 1.6;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline for now</h1>
      <p>This miniapp has not been opened on this device yet, so the required files are not cached. Open it once while online, then it will be available again without a connection.</p>
    </main>
  </body>
</html>
