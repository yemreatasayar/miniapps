name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "distribution/github-pages/site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: distribution/github-pages/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
