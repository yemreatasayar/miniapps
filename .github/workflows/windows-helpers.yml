name: Build and test Windows helpers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-helpers.yml"
      - "distribution/stem-helper/**"
      - "pdf-compress-server/server.mjs"
      - "scripts/windows/**"
      - "stem-splitter/backend/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-helpers
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: stem-splitter/package-lock.json

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem distribution/stem-helper/templates-windows/*.ps1, scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell syntax validation failed."
          }

      - name: Build Windows helper package
        run: node distribution/stem-helper/build-stem-helper-windows.mjs

      - name: Run Windows helper smoke tests
        shell: pwsh
        run: |
          & ./scripts/windows/test-windows-helpers.ps1 `
            -PackageRoot (Resolve-Path ./distribution/stem-helper-windows)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stem-helper-windows
          path: distribution/stem-helper/stem-helper-windows.zip
          if-no-files-found: error

      - name: Publish Windows helper release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload stem-helper-v0.1.0 `
            distribution/stem-helper/stem-helper-windows.zip `
            --clobber
